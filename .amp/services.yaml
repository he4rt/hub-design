services:
  api:
    command: bun run api
    port: 3001
    env:
      HUB_DEBUG: '1'
      HUB_PORTAL_URL: ${services.web.publicURL}
      VITE_GITHUB_ORG: he4rt-stuff
    health: /api/health
  web:
    command: bun run dev --host 0.0.0.0 --port "$PORT" --strictPort
    env:
      VITE_GITHUB_ORG: he4rt-stuff
    portal:
      url: /
      title: Landing
      description: Landing page. The debug sidebar (Alt+D) runs mock actions on every screen.
    portals:
      - url: /app
        title: App
        description: Member area. Log in with ana@he4rt.dev / password, try Discord, GitHub or Google (simulated), or create an account.
      - url: /admin
        title: Admin
        description: Admin panel, its own login. daniel@he4rt.dev / password.
      - url: /api
        title: API
        description: Bun + SQLite backend. Every screen reads and writes here; browse each table's rows.
