<!-- @dsCard group="Formulários" height=300 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:16px;font-family:var(--font-sans);color:var(--text);background:var(--bg);font-size:14px;line-height:21px}*{box-sizing:border-box}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.f{display:flex;flex-direction:column;gap:6px}.f label{font-size:13px;font-weight:600}.f input,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-md);font:inherit;color:var(--text);background:var(--surface)}.f input{height:var(--control-h);padding:0 12px}.f textarea{resize:vertical}.f input::placeholder,.f textarea::placeholder{color:var(--text-faint)}.hint{font-size:12.5px;line-height:18px;color:var(--text-muted)}.req{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--radius-pill);background:var(--warning-bg);color:var(--warning-text);font-size:11px;font-weight:700;margin-left:8px}.chk{display:flex;gap:10px;align-items:flex-start}.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--brand)}
</style>
</head>
<body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);max-width:720px"><div class="f"><label for="a">Por que agora não<span class="req">obrigatório</span></label><textarea id="a" rows="3" placeholder="Seja específico sobre o momento, não sobre a pessoa"></textarea><span class="hint">O membro lê. Passa pela moderação automática antes de salvar.</span></div><div class="f"><label for="b">O que fortalecer para a próxima<span class="req">obrigatório</span></label><textarea id="b" rows="3" placeholder="Aponte um caminho concreto"></textarea></div><div class="f"><label for="c">Quanto tempo por semana?</label><input id="c" placeholder="Ex.: 6 a 8 horas, mais à noite"></div><label class="chk"><input type="checkbox" checked><span><span style="font-weight:600">O critério de aceite foi cumprido</span><br><span class="hint">Conferido contra o objetivo do projeto.</span></span></label></div>
</body>
</html>
