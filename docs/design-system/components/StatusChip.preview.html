<!-- @dsCard group="Estado" height=72 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:16px;font-family:var(--font-sans);color:var(--text);background:var(--bg);font-size:14px;line-height:21px}*{box-sizing:border-box}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;white-space:nowrap}.ok{background:var(--success-bg);color:var(--success-text)}.warn{background:var(--warning-bg);color:var(--warning-text)}.info{background:var(--info-bg);color:var(--info-text)}.neutral{background:var(--neutral-bg);color:var(--neutral-text)}.comp{background:var(--brand-soft);color:var(--brand-soft-text)}.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font-size:12px;font-weight:500}.count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:var(--radius-pill);background:var(--brand-bright);color:var(--on-brand);font-size:11px;font-weight:700}
</style>
</head>
<body>
<div style="display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center"><span class="chip ok">Ativo</span><span class="chip warn">Pendente</span><span class="chip info">Atribuído a um validador</span><span class="chip neutral">Inativo</span><span class="chip comp">Modelagem de dados</span><span class="tag">Laravel</span><span class="tag">Nível júnior+</span><span class="count">3</span></div>
</body>
</html>
