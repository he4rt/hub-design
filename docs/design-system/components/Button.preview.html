<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:16px;font-family:var(--font-sans);color:var(--text);background:var(--bg);font-size:14px;line-height:21px}*{box-sizing:border-box}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--control-h);padding:0 var(--space-4);border-radius:var(--radius-md);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}.primary{background:var(--brand);color:var(--on-brand);border:1px solid var(--brand)}.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border-strong)}.ghost{background:transparent;color:var(--brand-text);border:1px solid transparent}.danger{background:var(--surface);color:var(--danger-text);border:1px solid var(--border-strong)}.dark{background:var(--ink);color:var(--on-ink);border:1px solid var(--ink)}
</style>
</head>
<body>
<div style="display:flex;gap:var(--space-2);flex-wrap:wrap"><button class="btn primary"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Aceitar entrega</button><button class="btn secondary">Salvar rascunho</button><button class="btn ghost">Ver tudo</button><button class="btn danger">Recusar com retorno</button><button class="btn dark">Ver PR no GitHub</button></div>
</body>
</html>
