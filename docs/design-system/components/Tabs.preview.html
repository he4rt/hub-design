<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:16px;font-family:var(--font-sans);color:var(--text);background:var(--bg);font-size:14px;line-height:21px}*{box-sizing:border-box}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px}.seg button{height:34px;padding:0 14px;border-radius:9px;border:0;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;background:transparent;color:var(--text-muted)}.seg button[aria-selected=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-tab)}.line{display:flex;gap:2px;border-bottom:1px solid var(--border)}.line button{height:42px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:transparent;cursor:pointer;font:inherit;font-weight:600;color:var(--text-muted)}.line button[aria-selected=true]{color:var(--text);border-bottom-color:var(--brand)}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:var(--space-4)"><div class="seg" role="tablist"><button role="tab" aria-selected="true">Com lugares abertos · 3</button><button role="tab" aria-selected="false">Todos · 8</button><button role="tab" aria-selected="false">Inativos · 2</button></div><div class="line" role="tablist"><button role="tab" aria-selected="true">Board</button><button role="tab" aria-selected="false">Entregas · 2</button><button role="tab" aria-selected="false">Membros · 4</button><button role="tab" aria-selected="false">Log</button></div></div>
</body>
</html>
