<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:16px;font-family:var(--font-sans);color:var(--text);background:var(--bg);font-size:14px;line-height:21px}*{box-sizing:border-box}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.row{display:flex;gap:14px}.rail{display:flex;flex-direction:column;align-items:center;width:14px;flex:none}.dot{width:10px;height:10px;border-radius:var(--radius-pill);margin-top:5px;box-shadow:0 0 0 3px var(--surface)}.line{width:2px;flex:1;background:var(--border);margin:4px 0 -14px}.t{font-weight:500}.m{font-size:12.5px;line-height:18px;color:var(--text-muted)}.ok{background:var(--success-text)}.v{background:var(--brand-bright)}.w{background:var(--warning-text)}.g{background:var(--text-faint)}
</style>
</head>
<body>
<section style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-5);max-width:520px"><div style="display:flex;flex-direction:column"><div class="row"><div class="rail"><span class="dot ok"></span><span class="line"></span></div><div style="padding-bottom:14px"><div class="t">Entrega aceita · Filtro por cidade</div><div class="m">Marina e Caio, em dupla · ontem, pela capitã Juliana</div></div></div><div class="row"><div class="rail"><span class="dot v"></span><span class="line"></span></div><div style="padding-bottom:14px"><div class="t">Pedro entrou no squad</div><div class="m">Candidatura aceita · há 4 dias</div></div></div><div class="row"><div class="rail"><span class="dot w"></span><span class="line"></span></div><div style="padding-bottom:14px"><div class="t">Entrega devolvida · Página de evento</div><div class="m">Faltou o estado vazio · há 6 dias</div></div></div><div class="row"><div class="rail"><span class="dot g"></span></div><div><div class="t">Projeto iniciado</div><div class="m">Painel de eventos da comunidade · 12 nov</div></div></div></div></section>
</body>
</html>
